name: CI/CD Docker Pipeline

# REQUISITO: Disparar en push a develop y PR a main
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      # 1. Obtener el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v3

      # 2. Login en Docker Hub (necesario para publicar)
      - name: Login en Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. REQUISITO: Construcción de la imagen Docker
      - name: Construir imagen Docker
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/mi-proyecto-duoc:latest .

      # 4. REQUISITO: Ejecución de pruebas unitarias DENTRO del contenedor
      # Usamos la imagen que acabamos de construir para correr el test
      - name: Correr Pruebas Unitarias en Docker
        run: docker run --rm ${{ secrets.DOCKER_USERNAME }}/mi-proyecto-duoc:latest npm test

      # 5. REQUISITO: Publicación de la imagen en Docker Hub
      # Solo se ejecuta si el paso anterior (pruebas) no falló
      - name: Publicar imagen en Docker Hub
        if: success()
        run: docker push ${{ secrets.DOCKER_USERNAME }}/mi-proyecto-duoc:latest